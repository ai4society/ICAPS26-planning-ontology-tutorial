[project]
name = "planning-ontology-tutorial"
version = "0.1.0"
description = "ICAPS 2026 tutorial on the planning ontology: knowledge representation and explainable planning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Bharath Muppasani" },
    { name = "Nitin Gupta" },
    { name = "Biplav Srivastava" },
    { name = "Vignesh Narayanan" },
]
dependencies = [
    "rdflib>=7.0",
    "pandas>=2.0",
    "unified-planning>=1.3.0",
    "up-pyperplan>=1.1.0",
]

[project.optional-dependencies]
# Run a PDDL planner and write fresh results into the KG (notebook 02).
# Unified Planning (aiplan4eu) is a third-party library, not part of this tutorial.
planner = [
    "unified-planning>=1.1",
    "up-pyperplan>=1.1",
]
# Knowledge-graph visualization.
viz = [
    "networkx>=3.0",
    "pyvis>=0.3",
]

[project.urls]
Homepage = "https://github.com/ai4society/ICAPS26-planning-ontology-tutorial"
Ontology = "https://purl.org/ai4s/ontology/planning"
Paper = "https://link.springer.com/article/10.1007/s44248-025-00093-9"

[dependency-groups]
# Tooling to run and build the notebooks locally.
dev = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbconvert>=7",
    "nbformat>=5",
]

[tool.uv]
package = false
