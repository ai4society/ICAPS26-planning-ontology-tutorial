<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 21 | maPO — Full Schema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./slide-theme.css">
  <script src="./slide-deck.js" defer></script>
  <style>
    .zoom .slide-inner { top: 52px; height: 972px; }
    .zoom .zhead { display: flex; align-items: baseline; gap: 20px; }
    .zoom .zhead .k { color: var(--blue); font-size: 19px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .zoom .zhead h1 { color: var(--garnet); font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
    .zoom .zfig { position: absolute; left: 0; right: 0; top: 92px; bottom: 96px; background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 16px; }
    .zoom .zfig img { width: 100%; height: 100%; object-fit: contain; }
    .zoom .zcap { position: absolute; left: 0; right: 0; bottom: 50px; text-align: center; color: var(--muted); font-size: 18px; font-style: italic; }
  </style>
</head>
<body>
  <div class="preview-shell">
    <main class="slide-canvas zoom" aria-labelledby="slide-title">
      <div class="slide-inner">
        <div class="zhead anim-fade">
          <span class="k">Multi-Agent · maPO</span>
          <h1 id="slide-title">The maPO Schema — Full View</h1>
        </div>
        <div class="zfig anim-fade d1"><img src="./assets/img/maPO_schema.png" alt="Full maPO schema"></div>
        <div class="zcap anim-fade d2">Agent, AgentState, sub-plans, CollisionEvent, ConflictAlert, ReplanningStrategy &amp; JointPlan — extending PO.</div>
      </div>
    </main>
  </div>
</body>
</html>
